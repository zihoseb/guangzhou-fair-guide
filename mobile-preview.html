<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端预览 - Canton Fair Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .subtitle {
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .device-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .device-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .device-btn:hover,
        .device-btn.active {
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 100%);
            border-color: #c41e3a;
        }

        .phone-frame {
            background: #1a1a1a;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 
                0 0 0 2px #333,
                0 20px 60px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .phone-notch {
            width: 120px;
            height: 25px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            margin: 0 auto 10px;
            position: relative;
        }

        .phone-screen {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* iPhone SE */
        .iphone-se .phone-screen {
            width: 375px;
            height: 667px;
        }

        /* iPhone 14 Pro */
        .iphone-14 .phone-screen {
            width: 393px;
            height: 852px;
        }

        /* iPhone 14 Pro Max */
        .iphone-14-max .phone-screen {
            width: 430px;
            height: 932px;
        }

        /* Samsung Galaxy S23 */
        .galaxy-s23 .phone-screen {
            width: 360px;
            height: 780px;
        }

        /* iPad Mini */
        .ipad-mini .phone-screen {
            width: 768px;
            height: 1024px;
        }

        .phone-home-indicator {
            width: 120px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 10px auto 0;
        }

        .rotate-hint {
            color: rgba(255,255,255,0.5);
            margin-top: 20px;
            font-size: 0.85rem;
            text-align: center;
        }

        .info-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            max-width: 600px;
            color: white;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .info-panel ul {
            list-style: none;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
        }

        .info-panel li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }

        .info-panel li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #10b981;
        }

        @media (max-width: 900px) {
            .ipad-mini .phone-screen {
                width: 375px;
                height: 667px;
            }
        }
    </style>
</head>
<body>
    <h1>📱 移动端预览</h1>
    <p class="subtitle">Canton Fair Guide - 响应式设计测试</p>

    <div class="device-selector">
        <button class="device-btn active" onclick="setDevice('iphone-se')">iPhone SE (375×667)</button>
        <button class="device-btn" onclick="setDevice('iphone-14')">iPhone 14 Pro (393×852)</button>
        <button class="device-btn" onclick="setDevice('iphone-14-max')">iPhone 14 Pro Max (430×932)</button>
        <button class="device-btn" onclick="setDevice('galaxy-s23')">Galaxy S23 (360×780)</button>
        <button class="device-btn" onclick="setDevice('ipad-mini')">iPad Mini (768×1024)</button>
    </div>

    <div class="phone-frame iphone-se" id="phoneFrame">
        <div class="phone-notch"></div>
        <div class="phone-screen">
            <iframe src="index.html" id="previewFrame"></iframe>
        </div>
        <div class="phone-home-indicator"></div>
    </div>

    <p class="rotate-hint">💡 提示：在 iframe 内可以滚动和点击交互</p>

    <div class="info-panel">
        <h3>移动端适配特性</h3>
        <ul>
            <li>响应式导航菜单（小屏幕自动隐藏）</li>
            <li>自适应字体大小和间距</li>
            <li>触摸友好的按钮尺寸</li>
            <li>地图覆盖层移动端优化</li>
            <li>支持触摸旋转地球仪</li>
        </ul>
    </div>

    <script>
        function setDevice(device) {
            const frame = document.getElementById('phoneFrame');
            const buttons = document.querySelectorAll('.device-btn');
            
            // 更新按钮状态
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 更新手机框架
            frame.className = 'phone-frame ' + device;
        }

        // 防止 iframe 内的链接在父页面打开
        document.getElementById('previewFrame').addEventListener('load', function() {
            this.contentDocument.querySelectorAll('a').forEach(link => {
                link.setAttribute('target', '_self');
            });
        });
    </script>
</body>
</html>
